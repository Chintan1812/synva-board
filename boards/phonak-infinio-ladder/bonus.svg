<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="715" viewBox="0 0 1400 715">
<rect x="0" y="0" width="1400" height="715" fill="#FFECBB"/>
<rect x="56" y="64" width="197.99" height="32" rx="16" fill="#FFFFFF"/>
<text x="154.995" y="80" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="700" fill="#4C3205">FREE, AT THE LINK BELOW</text>
<text x="56" y="169" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">Which Phonak do you actually need?</text>
<rect x="56" y="193" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="237" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">Six questions. It tells you the level, and why.</text>
<rect x="56" y="275" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="309" r="17" fill="#FBD34A"/><path d="M 87 309 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="297" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">It recommends higher ONLY if your answers require it</text>
<text x="128" y="322" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">Loud multi-speaker noise most days, a fitting range that demands it, or daily hands-free calls. Nothing else moves it up.</text>
<rect x="56" y="353" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="387" r="17" fill="#FBD34A"/><path d="M 87 387 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="375" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">Most people will be told to buy the cheaper one</text>
<text x="128" y="400" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">That is the whole point of building it this way.</text>
<rect x="56" y="431" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="465" r="17" fill="#FBD34A"/><path d="M 87 465 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="453" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">If you have already been quoted, bring the number</text>
<text x="128" y="478" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">It will tell you plainly whether you need the level you were quoted.</text>
<rect x="56" y="509" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="543" r="5" fill="#FBD34A"/>
<text x="128" y="531" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">It is a shortlist, not a prescription</text>
<text x="128" y="556" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#6B6B6B">The receiver and the fitting still need an audiologist.</text>
<text x="56" y="643" font-family="Inter" font-size="15.5" font-weight="600" fill="#4C3205">synva.io/tools/which-phonak  ·  name and mobile, nothing else</text>
</svg>

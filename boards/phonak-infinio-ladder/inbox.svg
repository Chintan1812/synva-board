<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="793" viewBox="0 0 1400 793">
<rect x="0" y="0" width="1400" height="793" fill="#FAF8F4"/>
<rect x="56" y="64" width="226.51" height="32" rx="16" fill="#FFECBB"/>
<text x="169.255" y="80" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="700" fill="#4C3205">WHAT IS ACTUALLY IN THE BOX</text>
<text x="56" y="169" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">An I50, opened</text>
<rect x="56" y="193" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="237" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">This is the same box at every level. That is the point.</text>
<rect x="56" y="275" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="309" r="17" fill="#FBD34A"/><path d="M 87 309 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="297" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">Two hearing aids</text>
<text x="128" y="322" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">Audéo Infinio Ultra R. Rechargeable, IP68, no battery door.</text>
<rect x="56" y="353" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="387" r="17" fill="#FBD34A"/><path d="M 87 387 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="375" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">The charger</text>
<text x="128" y="400" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">Standard charger, or ChargerGo with a battery built in for ₹6,000 more.</text>
<rect x="56" y="431" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="465" r="17" fill="#FBD34A"/><path d="M 87 465 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="453" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">Cleaning tools and documentation</text>
<text x="128" y="478" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">Plus the domes. The domes are fitted to your ear, not chosen by price.</text>
<rect x="56" y="509" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="543" r="5" fill="#FBD34A"/>
<text x="128" y="531" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">Receivers are ordered separately</text>
<text x="128" y="556" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#6B6B6B">Chosen by your hearing loss, not by which level you buy. S, M, MAV, P or UP.</text>
<rect x="56" y="587" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="621" r="5" fill="#FBD34A"/>
<text x="128" y="609" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">Nothing here changes between I30 and I90</text>
<text x="128" y="634" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#6B6B6B">Same body, same charger, same box. Only the software inside differs.</text>
<text x="56" y="721" font-family="Inter" font-size="15.5" font-weight="600" fill="#4C3205">So what does the extra money actually buy? That is the rest of this video.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="715" viewBox="0 0 1400 715">
<rect x="0" y="0" width="1400" height="715" fill="#FAF8F4"/>
<rect x="56" y="64" width="290.68" height="32" rx="16" fill="#FFECBB"/>
<text x="201.34" y="80" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="700" fill="#4C3205">THE STEP I PROMISED YOU AT THE START</text>
<text x="56" y="169" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">₹2,26,000 buys you two things</text>
<rect x="56" y="193" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="237" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">I70 at ₹4,44,000 a pair, I90 at ₹6,70,000 a pair.</text>
<rect x="56" y="275" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="309" r="17" fill="#FBD34A"/><path d="M 87 309 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="297" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">Speech Enhancer</text>
<text x="128" y="322" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">Lifts soft speech. The only feature Phonak lists on the I90 and not the I70.</text>
<rect x="56" y="353" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="387" r="17" fill="#FBD34A"/><path d="M 87 387 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="375" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">One more AutoSense program: "Speech in loud noise"</text>
<text x="128" y="400" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">The I90 classifies eight situations automatically, the I70 seven.</text>
<rect x="56" y="431" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="465" r="17" fill="none" stroke="#E8E4DC" stroke-width="2"/><path d="M 88 459 L 100 471 M 100 459 L 88 471" stroke="#6B6B6B" stroke-width="2.5" stroke-linecap="round"/>
<text x="128" y="453" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#6B6B6B">Channels: still 20</text>
<line x1="128" y1="453" x2="335.9" y2="453" stroke="#6B6B6B" stroke-width="2"/>
<text x="128" y="478" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#6B6B6B">Same as the I70. They stop climbing after the I70.</text>
<rect x="56" y="509" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="543" r="17" fill="none" stroke="#E8E4DC" stroke-width="2"/><path d="M 88 537 L 100 549 M 100 537 L 88 549" stroke="#6B6B6B" stroke-width="2.5" stroke-linecap="round"/>
<text x="128" y="531" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#6B6B6B">Warranty: still 3 years</text>
<line x1="128" y1="531" x2="393.65000000000003" y2="531" stroke="#6B6B6B" stroke-width="2"/>
<text x="128" y="556" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#6B6B6B">Same as the I70.</text>
<text x="56" y="643" font-family="Inter" font-size="15.5" font-weight="600" fill="#4C3205">Source: Phonak Infinio feature summary, doc 028-2681-03. Not my opinion.</text>
</svg>

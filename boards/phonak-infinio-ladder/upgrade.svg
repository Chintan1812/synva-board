<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="715" viewBox="0 0 1400 715">
<rect x="0" y="0" width="1400" height="715" fill="#FFECBB"/>
<rect x="56" y="64" width="190.85999999999999" height="32" rx="16" fill="#FFFFFF"/>
<text x="151.43" y="80" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="700" fill="#4C3205">IF YOU ALREADY OWN ONE</text>
<text x="56" y="169" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">Ultra is free. Go and ask for it.</text>
<rect x="56" y="193" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="237" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">Every Infinio sold since August 2024 can have it. Same hardware, new firmware.</text>
<rect x="56" y="275" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="309" r="17" fill="#FBD34A"/><path d="M 87 309 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="297" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">AutoSense OS 7.0</text>
<text x="128" y="322" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">Trained on 18x more real-world scenarios, 24% more precise than 6.0.</text>
<rect x="56" y="353" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="387" r="17" fill="#FBD34A"/><path d="M 87 387 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="375" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">About 30% better battery efficiency</text>
<text x="128" y="400" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">The single biggest complaint about the original Sphere.</text>
<rect x="56" y="431" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="465" r="17" fill="#FBD34A"/><path d="M 87 465 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="453" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">One-step Bluetooth pairing</text>
<text x="128" y="478" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">And faster feedback management.</text>
<rect x="56" y="509" width="1288" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="543" r="17" fill="#FBD34A"/><path d="M 87 543 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="531" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">Costs nothing, takes minutes</text>
<text x="128" y="556" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">In clinic, at your hearing care provider. It is a software update.</text>
<text x="56" y="643" font-family="Inter" font-size="15.5" font-weight="600" fill="#4C3205">Available since October 2025. This is why the whole line is now called Infinio Ultra.</text>
</svg>

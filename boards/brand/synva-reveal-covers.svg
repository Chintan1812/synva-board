<text x="48" y="194" font-family="Inter" font-size="15" font-weight="400" fill="#4F4F4F">Drop a veil over any part of a board, then delete or slide it away</text>
<text x="48" y="216" font-family="Inter" font-size="15" font-weight="400" fill="#4F4F4F">to reveal, one piece at a time.</text>

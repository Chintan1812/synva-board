<text x="92" y="327" font-family="Inter" font-size="15" font-weight="700" fill="#4C3205">The pick you reveal lives on this row</text>
<text x="74" y="372" font-family="Inter" font-size="16" font-weight="500" fill="#3A3A3A">Signia Styletto 7IX is the flagship model.</text>
<text x="74" y="402" font-family="Inter" font-size="16" font-weight="500" fill="#3A3A3A">Everyone lands in one of three budget tiers.</text>

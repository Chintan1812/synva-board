<svg xmlns="http://www.w3.org/2000/svg" width="1752" height="1017" viewBox="0 0 1752 1017">
<rect x="0" y="0" width="1752" height="1017" fill="#FAF8F4"/>
<rect x="56" y="60" width="288.96000000000004" height="34" rx="17" fill="#FFECBB"/>
<text x="200.48000000000002" y="77" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12" font-weight="700" fill="#4C3205">WHAT THE EXTRA MONEY ACTUALLY BUYS</text>
<text x="56" y="158" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">Every step keeps everything below it</text>
<rect x="56" y="174" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="208" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">Nothing here is a downgrade. The question is only how far up you actually need to go.</text>
<rect x="56" y="236" width="392" height="551" rx="22" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<text x="82" y="278" font-family="Inter" font-size="11" font-weight="700" fill="#6B6B6B">WHERE ₹50,000 STARTS</text>
<text x="82" y="314" font-family="Bricolage Grotesque" font-size="25" font-weight="700" fill="#1A1A1A">Terra RIC-312</text>
<text x="82" y="338" font-family="Inter" font-size="13.5" font-weight="400" fill="#4F4F4F">Terra platform · 8 ch</text>
<line x1="82" y1="356" x2="422" y2="356" stroke="#E8E4DC" stroke-width="1"/>
<text x="82" y="390" font-family="Inter" font-size="11" font-weight="700" fill="#4C3205">WHERE IT STOPS</text>
<circle cx="92" cy="413" r="4" fill="#6B6B6B"/>
<text x="112" y="413" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">AutoSense OS™ 5.0 (Limited)</text>
<circle cx="92" cy="450" r="4" fill="#6B6B6B"/>
<text x="112" y="450" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">NoiseBlock (Limited settings)</text>
<rect x="74" y="683" width="356" height="86" rx="14" fill="#FFECBB"/>
<text x="90" y="708" dominant-baseline="central" font-family="Inter" font-size="13" font-weight="600" fill="#4C3205">Those two words are the whole difference. In</text>
<text x="90" y="726" dominant-baseline="central" font-family="Inter" font-size="13" font-weight="600" fill="#4C3205">the fitting software your audiologist cannot</text>
<text x="90" y="744" dominant-baseline="central" font-family="Inter" font-size="13" font-weight="600" fill="#4C3205">change anything beyond basic settings.</text>
<rect x="472" y="236" width="392" height="551" rx="22" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<text x="498" y="278" font-family="Inter" font-size="11" font-weight="700" fill="#6B6B6B">EVERYTHING LEFT, PLUS</text>
<text x="498" y="314" font-family="Bricolage Grotesque" font-size="25" font-weight="700" fill="#1A1A1A">Terra+ RIC-312</text>
<text x="498" y="338" font-family="Inter" font-size="13.5" font-weight="400" fill="#4F4F4F">Terra platform · 10 ch</text>
<line x1="498" y1="356" x2="838" y2="356" stroke="#E8E4DC" stroke-width="1"/>
<text x="498" y="390" font-family="Inter" font-size="11" font-weight="700" fill="#4C3205">WHAT IT ADDS</text>
<text x="508" y="413" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#4C3205">+</text>
<text x="528" y="413" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">Bluetooth (Universal)</text>
<text x="508" y="450" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#4C3205">+</text>
<text x="528" y="450" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">8 to 10 channels</text>
<text x="508" y="487" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#4C3205">+</text>
<text x="528" y="487" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">SoundRecover2</text>
<text x="508" y="524" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#4C3205">+</text>
<text x="528" y="524" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">myPhonak</text>
<rect x="490" y="683" width="356" height="86" rx="14" fill="#FAF8F4"/>
<text x="506" y="708" dominant-baseline="central" font-family="Inter" font-size="13" font-weight="600" fill="#6B6B6B">Marginal. You are buying Bluetooth here, not</text>
<text x="506" y="726" dominant-baseline="central" font-family="Inter" font-size="13" font-weight="600" fill="#6B6B6B">better sound. And it has already left the</text>
<text x="506" y="744" dominant-baseline="central" font-family="Inter" font-size="13" font-weight="600" fill="#6B6B6B">₹50,000 band.</text>
<rect x="888" y="236" width="392" height="551" rx="22" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<text x="914" y="278" font-family="Inter" font-size="11" font-weight="700" fill="#6B6B6B">EVERYTHING LEFT, PLUS</text>
<text x="914" y="314" font-family="Bricolage Grotesque" font-size="25" font-weight="700" fill="#1A1A1A">Audeo L30-R</text>
<text x="914" y="338" font-family="Inter" font-size="13.5" font-weight="400" fill="#4F4F4F">Lumity platform · 12 ch</text>
<line x1="914" y1="356" x2="1254" y2="356" stroke="#E8E4DC" stroke-width="1"/>
<text x="914" y="390" font-family="Inter" font-size="11" font-weight="700" fill="#4C3205">WHAT IT ADDS</text>
<text x="924" y="413" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#4C3205">+</text>
<text x="944" y="413" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">AutoSense OS 5.0</text>
<text x="924" y="450" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#4C3205">+</text>
<text x="944" y="450" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">Roger Technology</text>
<text x="924" y="487" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#4C3205">+</text>
<text x="944" y="487" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">SmartSpeech Technology</text>
<text x="924" y="524" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#4C3205">+</text>
<text x="944" y="524" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">Tinnitus Balance</text>
<text x="924" y="561" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#4C3205">+</text>
<text x="944" y="561" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">WindBlock</text>
<rect x="906" y="701" width="356" height="68" rx="14" fill="#FAF8F4"/>
<text x="922" y="726" dominant-baseline="central" font-family="Inter" font-size="13" font-weight="600" fill="#6B6B6B">Its only honest limitation: it is the</text>
<text x="922" y="744" dominant-baseline="central" font-family="Inter" font-size="13" font-weight="600" fill="#6B6B6B">previous platform.</text>
<rect x="1304" y="236" width="392" height="551" rx="22" fill="#FFECBB" stroke="#FBD34A" stroke-width="2.5"/>
<text x="1330" y="278" font-family="Inter" font-size="11" font-weight="700" fill="#4C3205">EVERYTHING LEFT, PLUS</text>
<text x="1330" y="314" font-family="Bricolage Grotesque" font-size="25" font-weight="700" fill="#1A1A1A">Audeo I 30-R Go</text>
<text x="1330" y="338" font-family="Inter" font-size="13.5" font-weight="400" fill="#4C3205">Infinio platform, the current one · 12 ch</text>
<line x1="1330" y1="356" x2="1670" y2="356" stroke="#FBD34A" stroke-width="1"/>
<text x="1330" y="390" font-family="Inter" font-size="11" font-weight="700" fill="#4C3205">THE FIVE UPGRADES</text>
<circle cx="1340" cy="413" r="12.5" fill="#FBD34A"/>
<text x="1340" y="413" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="700" fill="#4C3205">1</text>
<text x="1360" y="413" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">ERA chip</text>
<text x="1446" y="414" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="400" fill="#6B6B6B">was PRISM</text>
<text x="1360" y="433" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="400" fill="#4C3205">Better sound, faster pairing, less battery</text>
<text x="1360" y="450" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="400" fill="#4C3205">drain while streaming.</text>
<circle cx="1340" cy="484" r="12.5" fill="#FBD34A"/>
<text x="1340" y="484" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="700" fill="#4C3205">2</text>
<text x="1360" y="484" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">AutoSense OS 6.0</text>
<text x="1518" y="485" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="400" fill="#6B6B6B">was 5.0</text>
<text x="1360" y="504" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="400" fill="#4C3205">Twice the environments, scans 700 times a</text>
<text x="1360" y="521" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="400" fill="#4C3205">second, 24% more accurate.</text>
<circle cx="1340" cy="555" r="12.5" fill="#FBD34A"/>
<text x="1340" y="555" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="700" fill="#4C3205">3</text>
<text x="1360" y="555" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">Bluetooth 5.3 dual-mode</text>
<text x="1581" y="556" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="400" fill="#6B6B6B">was 4.2</text>
<text x="1360" y="575" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="400" fill="#4C3205">Two devices at once, hands-free calling on</text>
<text x="1360" y="592" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="400" fill="#4C3205">Android and iOS.</text>
<circle cx="1340" cy="626" r="12.5" fill="#FBD34A"/>
<text x="1340" y="626" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="700" fill="#4C3205">4</text>
<text x="1360" y="626" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">EasyGuard wax management</text>
<text x="1590" y="627" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="400" fill="#6B6B6B">new</text>
<text x="1360" y="646" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="400" fill="#4C3205">The dome blocks wax before the receiver. No</text>
<text x="1360" y="663" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="400" fill="#4C3205">fiddly wax-guard changes.</text>
<circle cx="1340" cy="697" r="12.5" fill="#FBD34A"/>
<text x="1340" y="697" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="700" fill="#4C3205">5</text>
<text x="1360" y="697" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="600" fill="#3A3A3A">APD 3.0 fitting formula</text>
<text x="1581" y="698" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="400" fill="#6B6B6B">was 2.0</text>
<text x="1360" y="717" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="400" fill="#4C3205">From 8.91 lakh fittings: one fewer</text>
<text x="1360" y="734" dominant-baseline="central" font-family="Inter" font-size="12.5" font-weight="400" fill="#4C3205">follow-up visit on average.</text>
<circle cx="460" cy="314" r="17" fill="#FBD34A"/>
<text x="460" y="314" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#4C3205">+</text>
<circle cx="876" cy="314" r="17" fill="#FBD34A"/>
<text x="876" y="314" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#4C3205">+</text>
<circle cx="1292" cy="314" r="17" fill="#FBD34A"/>
<text x="1292" y="314" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#4C3205">+</text>
<text x="56" y="861" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">The extra money is not buying you louder, or clearer out of the box.</text>
<text x="56" y="893" font-family="Inter" font-size="17" font-weight="400" fill="#4F4F4F">It is buying headroom: how much your audiologist can shape it for you afterwards, and how well it</text>
<text x="56" y="917" font-family="Inter" font-size="17" font-weight="400" fill="#4F4F4F">keeps up when the room changes without you touching it.</text>
<text x="56" y="949" font-family="Inter" font-size="13" font-weight="400" fill="#6B6B6B">This is the platform ladder. Which body you need, behind the ear or in it, is a separate question.</text>
</svg>

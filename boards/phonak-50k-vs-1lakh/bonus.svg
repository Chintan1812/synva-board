<svg xmlns="http://www.w3.org/2000/svg" width="1462" height="1016" viewBox="0 0 1462 1016">
<rect x="0" y="0" width="1462" height="1016" fill="#FAF8F4"/>
<rect x="56" y="60" width="199.68" height="34" rx="17" fill="#FFECBB"/>
<text x="155.84" y="77" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12" font-weight="700" fill="#4C3205">THE BONUS, AS PROMISED</text>
<text x="56" y="158" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">Six questions. An honest answer.</text>
<rect x="56" y="174" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="206" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">About your hearing and your life. No jargon, nothing to look up.</text>
<rect x="56" y="232" width="700" height="530" rx="22" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<text x="86" y="280" font-family="Inter" font-size="11.5" font-weight="700" fill="#6B6B6B">WHAT IT ASKS</text>
<line x1="86" y1="308" x2="726" y2="308" stroke="#E8E4DC" stroke-width="1"/>
<circle cx="108" cy="358" r="17" fill="#FAF8F4"/>
<text x="108" y="358" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="700" fill="#6B6B6B">1</text>
<text x="140" y="358" dominant-baseline="central" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A1A">Are your days mostly at home, or mostly out?</text>
<circle cx="108" cy="416" r="17" fill="#FAF8F4"/>
<text x="108" y="416" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="700" fill="#6B6B6B">2</text>
<text x="140" y="416" dominant-baseline="central" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A1A">Do you lose the thread in a restaurant or at a function?</text>
<circle cx="108" cy="474" r="17" fill="#FAF8F4"/>
<text x="108" y="474" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="700" fill="#6B6B6B">3</text>
<text x="140" y="474" dominant-baseline="central" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A1A">Is the phone a big part of your day?</text>
<circle cx="108" cy="532" r="17" fill="#FBD34A"/>
<text x="108" y="532" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="700" fill="#4C3205">4</text>
<text x="140" y="532" dominant-baseline="central" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A1A">Changing batteries, or rechargeable?</text>
<circle cx="108" cy="590" r="17" fill="#FBD34A"/>
<text x="108" y="590" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="700" fill="#4C3205">5</text>
<text x="140" y="590" dominant-baseline="central" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A1A">Does it have to be invisible?</text>
<circle cx="108" cy="648" r="17" fill="#FAF8F4"/>
<text x="108" y="648" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="700" fill="#6B6B6B">6</text>
<text x="140" y="648" dominant-baseline="central" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A1A">Is this for you, or for someone else?</text>
<rect x="80" y="696" width="652" height="44" rx="14" fill="#FFECBB"/>
<text x="100" y="718" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="600" fill="#4C3205">Four and five are the two where Phonak can lose. That is on purpose.</text>
<rect x="786" y="232" width="620" height="530" rx="22" fill="#FFECBB" stroke="#FBD34A" stroke-width="2.5"/>
<text x="816" y="280" font-family="Inter" font-size="11.5" font-weight="700" fill="#4C3205">WHAT COMES BACK</text>
<line x1="816" y1="308" x2="1376" y2="308" stroke="#FBD34A" stroke-width="1"/>
<text x="838" y="360" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="700" fill="#4C3205">1</text>
<circle cx="838" cy="360" r="17" fill="none" stroke="#4C3205" stroke-width="2"/>
<text x="870" y="360" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">Is a Phonak right for you at all?</text>
<rect x="816" y="390" width="560" height="118" rx="16" fill="#FFFFFF" stroke="#4C3205" stroke-width="2"/>
<text x="838" y="416" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="500" fill="#3A3A3A">And the answer can be</text>
<text x="838" y="454" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="42" font-weight="700" fill="#1A1A1A">NO</text>
<text x="838" y="488" dominant-baseline="central" font-family="Inter" font-size="13.5" font-weight="400" fill="#6B6B6B">Two of these questions have no Phonak answer.</text>
<text x="838" y="558" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="700" fill="#4C3205">2</text>
<circle cx="838" cy="558" r="17" fill="none" stroke="#4C3205" stroke-width="2"/>
<text x="870" y="558" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">If it is, which ones are yours</text>
<text x="870" y="588" dominant-baseline="central" font-family="Inter" font-size="14.5" font-weight="400" fill="#4C3205">Named models, at your budget, for your life.</text>
<rect x="816" y="644" width="560" height="96" rx="16" fill="#FFFFFF"/>
<text x="838" y="670" dominant-baseline="central" font-family="Inter" font-size="10.5" font-weight="700" fill="#6B6B6B">WHAT A NO LOOKS LIKE</text>
<text x="838" y="696" dominant-baseline="central" font-family="Inter" font-size="14.5" font-weight="600" fill="#1A1A1A">Profound loss, and you want rechargeable?</text>
<text x="838" y="718" dominant-baseline="central" font-family="Inter" font-size="13.5" font-weight="400" fill="#6B6B6B">Phonak has no answer. We say so, and say what does.</text>
<rect x="56" y="796" width="1350" height="96" rx="20" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<g transform="translate(88 828) scale(1.2500)"><path d="M13 5h8" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 12h8" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 19h8" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m3 17 2 2 4-4" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m3 7 2 2 4-4" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="134" y="836" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#1A1A1A">Take it here</text>
<text x="134" y="862" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#4F4F4F">Link in the description, right at the top.</text>
<rect x="914" y="818" width="468.00000000000006" height="52" rx="26" fill="#FBD34A"/>
<text x="942" y="844" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#4C3205">synva.io/knowledge-hub/phonak-check</text>
<g transform="translate(1338 832) scale(1.0000)"><path d="M7 7h10v10" fill="none" stroke="#4C3205" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 17 17 7" fill="none" stroke="#4C3205" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="56" y="936" font-family="Inter" font-size="15" font-weight="400" fill="#6B6B6B">The questions are open to everyone. The answer is the part worth asking for.</text>
</svg>

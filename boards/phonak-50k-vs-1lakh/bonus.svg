<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="750" viewBox="0 0 1300 750">
<rect x="0" y="0" width="1300" height="750" fill="#FAF8F4"/>
<rect x="56" y="60" width="207.12" height="34" rx="17" fill="#FFECBB"/>
<text x="159.56" y="77" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12" font-weight="700" fill="#4C3205">THE TOOL FROM THE VIDEO</text>
<text x="56" y="158" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">Is a Phonak hearing aid right for you?</text>
<rect x="56" y="174" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="208" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">Three questions. Then a straight answer, in under a minute.</text>
<rect x="56" y="250" width="380" height="148" rx="20" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="102" cy="300" r="20" fill="#FBD34A"/>
<text x="102" y="300" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="19" font-weight="700" fill="#4C3205">1</text>
<text x="136" y="300" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="25" font-weight="700" fill="#1A1A1A">Your hearing</text>
<text x="86" y="354" font-family="Inter" font-size="15" font-weight="400" fill="#4F4F4F">Plot your audiogram, or just tell us honestly.</text>
<rect x="460" y="250" width="380" height="148" rx="20" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="506" cy="300" r="20" fill="#FBD34A"/>
<text x="506" y="300" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="19" font-weight="700" fill="#4C3205">2</text>
<text x="540" y="300" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="25" font-weight="700" fill="#1A1A1A">Your week</text>
<text x="490" y="354" font-family="Inter" font-size="15" font-weight="400" fill="#4F4F4F">How you actually spend your days.</text>
<rect x="864" y="250" width="380" height="148" rx="20" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="910" cy="300" r="20" fill="#FBD34A"/>
<text x="910" y="300" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="19" font-weight="700" fill="#4C3205">3</text>
<text x="944" y="300" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="25" font-weight="700" fill="#1A1A1A">Who it is for</text>
<text x="894" y="354" font-family="Inter" font-size="15" font-weight="400" fill="#4F4F4F">You, or someone you love.</text>
<rect x="56" y="432" width="1188" height="132" rx="20" fill="#FFECBB" stroke="#FBD34A" stroke-width="2"/>
<text x="90" y="478" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#1A1A1A">You get named models, at your budget, for your life.</text>
<text x="90" y="516" font-family="Inter" font-size="19" font-weight="600" fill="#4C3205">And if another brand fits you better, we say that too.</text>
<text x="90" y="542" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">That is the whole point of it.</text>
<rect x="56" y="598" width="1188" height="96" rx="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="90" y="646" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#1A1A1A">synva.io/phonak-hearing-aid-recommendation</text>
<g transform="translate(1182 630) scale(1.3333)"><path d="M7 7h10v10" fill="none" stroke="#4C3205" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 17 17 7" fill="none" stroke="#4C3205" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="637" viewBox="0 0 1240 637">
<rect x="0" y="0" width="1240" height="637" fill="#FAF8F4"/>
<rect x="56" y="64" width="262.15999999999997" height="32" rx="16" fill="#FFECBB"/>
<text x="187.07999999999998" y="80" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="700" fill="#4C3205">THE HONEST ANSWER AT THIS BUDGET</text>
<text x="56" y="169" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">Phonak gives you neither</text>
<rect x="56" y="193" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="237" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">Both of these exist at this money. Just not from Phonak.</text>
<rect x="56" y="275" width="1128" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="309" r="17" fill="#FBD34A"/><path d="M 87 309 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="297" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">Want it rechargeable?</text>
<text x="128" y="322" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">Signia Orion 50. Same money, and the one that sells most at this price.</text>
<rect x="56" y="353" width="1128" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="387" r="17" fill="#FBD34A"/><path d="M 87 387 l 4.5 5 l 9 -10" fill="none" stroke="#4C3205" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="375" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">Want Bluetooth?</text>
<text x="128" y="400" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#3A3A3A">Signia Sirion 75. Same money, and 12 channels instead of 8.</text>
<rect x="56" y="431" width="1128" height="68" rx="16" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="94" cy="465" r="17" fill="none" stroke="#E8E4DC" stroke-width="2"/><path d="M 88 459 L 100 471 M 100 459 L 88 471" stroke="#6B6B6B" stroke-width="2.5" stroke-linecap="round"/>
<text x="128" y="453" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#1A1A1A">Phonak Terra</text>
<text x="128" y="478" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="400" fill="#6B6B6B">8 channels. No Bluetooth. No rechargeable. At the same price as both of the above.</text>
<text x="56" y="565" font-family="Inter" font-size="15.5" font-weight="600" fill="#4C3205">Phonak earns its money higher up. Not here.</text>
</svg>

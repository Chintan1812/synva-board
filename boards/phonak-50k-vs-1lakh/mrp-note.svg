<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="677" viewBox="0 0 1240 677">
<rect x="0" y="0" width="1240" height="677" fill="#FAF8F4"/>
<rect x="56" y="64" width="226.51" height="32" rx="16" fill="#FFECBB"/>
<text x="169.255" y="80" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="700" fill="#4C3205">BEFORE WE LOOK AT ANY PRICE</text>
<text x="56" y="169" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">Every price you see is MRP</text>
<rect x="56" y="193" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="237" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">The number on the box. Not the number you pay.</text>
<rect x="56" y="275" width="468" height="232" rx="22" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<text x="290" y="323" text-anchor="middle" font-family="Inter" font-size="11.5" font-weight="700" fill="#6B6B6B">WHAT THE BOARD SHOWS</text>
<text x="290" y="397" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="58" font-weight="700" fill="#1A1A1A">₹1,38,000</text>
<text x="290" y="469" text-anchor="middle" font-family="Inter" font-size="14.5" font-weight="400" fill="#4F4F4F">MRP, a pair. Same at every clinic.</text>
<text x="620" y="357" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#6B6B6B">minus</text>
<text x="620" y="379" text-anchor="middle" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#4C3205">the discount</text>
<line x1="576" y1="407" x2="650" y2="407" stroke="#FBD34A" stroke-width="7" stroke-linecap="round"/>
<path d="M 640 391 L 664 407 L 640 423" fill="none" stroke="#FBD34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="620" y="451" text-anchor="middle" font-family="Inter" font-size="13" font-weight="400" fill="#6B6B6B">different everywhere</text>
<rect x="716" y="275" width="468" height="232" rx="22" fill="#FFECBB"/>
<rect x="716" y="275" width="468" height="232" rx="22" fill="none" stroke="#FBD34A" stroke-width="2.5" stroke-dasharray="10 8"/>
<text x="950" y="323" text-anchor="middle" font-family="Inter" font-size="11.5" font-weight="700" fill="#4C3205">WHAT YOU ACTUALLY PAY</text>
<text x="950" y="397" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="66" font-weight="700" fill="#4C3205">?</text>
<text x="950" y="469" text-anchor="middle" font-family="Inter" font-size="14.5" font-weight="600" fill="#4C3205">Only a clinic can fill this in.</text>
<rect x="56" y="559" width="345.85" height="52" rx="26" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<text x="82" y="585" dominant-baseline="central" font-family="Inter" font-size="15.5" font-weight="500" fill="#3A3A3A">Every clinic discounts differently</text>
<rect x="417.85" y="559" width="260.6" height="52" rx="26" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<text x="443.85" y="585" dominant-baseline="central" font-family="Inter" font-size="15.5" font-weight="500" fill="#3A3A3A">So ask before you decide</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1174" height="884" viewBox="0 0 1174 884">
<rect x="0" y="0" width="1174" height="884" fill="#FAF8F4"/>
<rect x="56" y="60" width="274.08" height="34" rx="17" fill="#FFECBB"/>
<text x="193.04" y="77" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12" font-weight="700" fill="#4C3205">₹50,000 OR ₹1,00,000, IN PHONAK?</text>
<text x="56" y="158" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">It was never about your hearing loss</text>
<rect x="56" y="174" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="208" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">At both budgets Phonak fits the same ears. So the real question is your lifestyle.</text>
<rect x="56" y="222" width="1062" height="502" rx="22" fill="#FFFFFF"/>
<line x1="386" y1="222" x2="386" y2="724" stroke="#E8E4DC" stroke-width="1"/>
<line x1="752" y1="222" x2="752" y2="724" stroke="#E8E4DC" stroke-width="1"/>
<line x1="1118" y1="222" x2="1118" y2="724" stroke="#E8E4DC" stroke-width="1"/>
<text x="84" y="280" font-family="Bricolage Grotesque" font-size="20" font-weight="600" fill="#1A1A1A">Two budgets</text>
<text x="84" y="308" font-family="Inter" font-size="13.5" font-weight="400" fill="#6B6B6B">One of these is twice</text>
<text x="84" y="328" font-family="Inter" font-size="13.5" font-weight="400" fill="#6B6B6B">the price of the other.</text>
<text x="569" y="284" text-anchor="middle" font-family="Bricolage Grotesque" font-size="40" font-weight="700" fill="#1A1A1A">₹50,000</text>
<text x="569" y="314" text-anchor="middle" font-family="Bricolage Grotesque" font-size="17" font-weight="600" fill="#3A3A3A">Terra RIC-312</text>
<text x="569" y="338" text-anchor="middle" font-family="Inter" font-size="13" font-weight="400" fill="#6B6B6B">the entry Phonak</text>
<text x="935" y="284" text-anchor="middle" font-family="Bricolage Grotesque" font-size="40" font-weight="700" fill="#1A1A1A">₹1,00,000</text>
<text x="935" y="314" text-anchor="middle" font-family="Bricolage Grotesque" font-size="17" font-weight="600" fill="#3A3A3A">Audeo I30-R Go</text>
<text x="935" y="338" text-anchor="middle" font-family="Inter" font-size="13" font-weight="400" fill="#6B6B6B">the one we recommend</text>
<line x1="56" y1="372" x2="1118" y2="372" stroke="#E8E4DC" stroke-width="1.5"/>
<text x="84" y="409" font-family="Inter" font-size="18" font-weight="600" fill="#1A1A1A">Fits which hearing loss</text>
<text x="84" y="431" font-family="Inter" font-size="13" font-weight="400" fill="#6B6B6B">the audiogram range it covers</text>
<text x="569" y="421" text-anchor="middle" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">0 to 110 dB</text>
<text x="935" y="421" text-anchor="middle" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">0 to 110 dB</text>
<line x1="56" y1="454" x2="1118" y2="454" stroke="#E8E4DC" stroke-width="1"/>
<text x="84" y="491" font-family="Inter" font-size="18" font-weight="600" fill="#1A1A1A">Warranty</text>
<text x="84" y="513" font-family="Inter" font-size="13" font-weight="400" fill="#6B6B6B">years covered</text>
<text x="569" y="503" text-anchor="middle" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">2 years</text>
<text x="935" y="503" text-anchor="middle" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">2 years</text>
<line x1="56" y1="536" x2="1118" y2="536" stroke="#E8E4DC" stroke-width="1"/>
<rect x="385" y="372" width="732" height="164" fill="#FAF8F4" opacity="0.6"/>
<text x="569" y="421" text-anchor="middle" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">0 to 110 dB</text>
<text x="935" y="421" text-anchor="middle" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">0 to 110 dB</text>
<text x="569" y="503" text-anchor="middle" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">2 years</text>
<text x="935" y="503" text-anchor="middle" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">2 years</text>
<rect x="57.5" y="536" width="1059" height="188" fill="#FFECBB"/>
<text x="84" y="604" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#4C3205">The one thing Phonak does</text>
<text x="84" y="628" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#4C3205">better than anyone else</text>
<text x="84" y="660" font-family="Inter" font-size="13.5" font-weight="400" fill="#4C3205">You already know the brand.</text>
<text x="84" y="680" font-family="Inter" font-size="13.5" font-weight="600" fill="#4C3205">You do not know this bit.</text>
<rect x="457.5" y="584" width="58" height="20" rx="5" fill="#6B6B6B" opacity="0.35"/>
<rect x="524.5" y="584" width="34" height="20" rx="5" fill="#6B6B6B" opacity="0.35"/>
<rect x="567.5" y="584" width="78" height="20" rx="5" fill="#6B6B6B" opacity="0.35"/>
<rect x="654.5" y="584" width="26" height="20" rx="5" fill="#6B6B6B" opacity="0.35"/>
<circle cx="477" cy="650" r="20" fill="none" stroke="#6B6B6B" stroke-width="2.2"/><path d="M 469.5 642.5 L 484.5 657.5 M 484.5 642.5 L 469.5 657.5" stroke="#6B6B6B" stroke-width="2.8" stroke-linecap="round"/>
<text x="585" y="658" text-anchor="middle" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#1A1A1A">It is NOT in here</text>
<text x="569" y="692" text-anchor="middle" font-family="Inter" font-size="13.5" font-weight="400" fill="#6B6B6B">and nobody tells you that</text>
<rect x="823.5" y="584" width="58" height="20" rx="5" fill="#4C3205" opacity="0.85"/>
<rect x="890.5" y="584" width="34" height="20" rx="5" fill="#4C3205" opacity="0.85"/>
<rect x="933.5" y="584" width="78" height="20" rx="5" fill="#4C3205" opacity="0.85"/>
<rect x="1020.5" y="584" width="26" height="20" rx="5" fill="#4C3205" opacity="0.85"/>
<circle cx="857" cy="650" r="20" fill="#FBD34A"/><path d="M 849 650 l 5 5.5 l 10.5 -11" fill="none" stroke="#4C3205" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="957" y="658" text-anchor="middle" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#4C3205">It is in here</text>
<text x="935" y="692" text-anchor="middle" font-family="Inter" font-size="13.5" font-weight="400" fill="#4C3205">and it is why people pay this</text>
<rect x="56" y="222" width="1062" height="502" rx="22" fill="none" stroke="#E8E4DC" stroke-width="1.5"/>
<text x="56" y="780" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">Same ears. Same warranty. Twice the price.</text>
<text x="56" y="812" font-family="Inter" font-size="16.5" font-weight="400" fill="#4F4F4F">So the question was never which one suits your hearing loss. It is which one suits your life.</text>
</svg>

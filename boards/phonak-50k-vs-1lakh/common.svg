<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="966" viewBox="0 0 1460 966">
<rect x="0" y="0" width="1460" height="966" fill="#FAF8F4"/>
<rect x="56" y="60" width="229.44" height="34" rx="17" fill="#FFECBB"/>
<text x="170.72" y="77" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12" font-weight="700" fill="#4C3205">BEFORE WE COMPARE ANYTHING</text>
<text x="56" y="158" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">Your hearing loss does not decide the price</text>
<rect x="56" y="174" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="208" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">Both budgets already fit the same ears, 0 to 120 dB. Something else decides what you spend.</text>
<rect x="56" y="250" width="660" height="396" rx="22" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<circle cx="102" cy="296" r="19" fill="none" stroke="#6B6B6B" stroke-width="2.2"/>
<path d="M 95 289 L 109 303 M 109 289 L 95 303" stroke="#6B6B6B" stroke-width="2.6" stroke-linecap="round"/>
<text x="136" y="288" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="700" fill="#6B6B6B">DOES NOT DECIDE THE PRICE</text>
<text x="136" y="312" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="30" font-weight="700" fill="#1A1A1A">Your hearing loss</text>
<text x="90" y="391" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#1A1A1A">₹50,000</text>
<rect x="232" y="378" width="440" height="26" rx="13" fill="#FFECBB"/>
<text x="452" y="391" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="700" fill="#4C3205">0 to 120 dB</text>
<text x="90" y="453" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#1A1A1A">₹1,00,000</text>
<rect x="232" y="440" width="440" height="26" rx="13" fill="#FFECBB"/>
<text x="452" y="453" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="700" fill="#4C3205">0 to 120 dB</text>
<text x="161" y="368" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="#6B6B6B"></text>
<text x="232" y="368" dominant-baseline="central" font-family="Inter" font-size="10.5" font-weight="700" fill="#6B6B6B">MILD</text>
<text x="672" y="368" font-family="Inter" font-size="10.5" font-weight="700" fill="#6B6B6B" text-anchor="end">PROFOUND</text>
<text x="90" y="524" dominant-baseline="central" font-family="Inter" font-size="14.5" font-weight="500" fill="#3A3A3A">Same 2 year warranty on every one of them.</text>
<rect x="78" y="572" width="616" height="54" rx="14" fill="#FAF8F4"/>
<text x="96" y="598" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="600" fill="#6B6B6B">It decides the shape you need, behind the ear or inside it. Not the price.</text>
<rect x="744" y="250" width="660" height="396" rx="22" fill="#EBF9FF" stroke="#BEE1F4" stroke-width="2.5"/>
<circle cx="790" cy="296" r="19" fill="#BEE1F4"/>
<path d="M 782 296 l 6 6.5 l 12 -13" fill="none" stroke="#1D5180" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="824" y="288" dominant-baseline="central" font-family="Inter" font-size="11.5" font-weight="700" fill="#1D5180">THIS IS WHAT DECIDES IT</text>
<text x="824" y="312" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="30" font-weight="700" fill="#1A1A1A">Your lifestyle</text>
<circle cx="786" cy="377" r="4.5" fill="#1D5180"/>
<text x="806" y="377" dominant-baseline="central" font-family="Inter" font-size="16.5" font-weight="500" fill="#1A1A1A">Where your day actually happens.</text>
<circle cx="786" cy="419" r="4.5" fill="#1D5180"/>
<text x="806" y="419" dominant-baseline="central" font-family="Inter" font-size="16.5" font-weight="500" fill="#1A1A1A">How often the room around you changes.</text>
<circle cx="786" cy="461" r="4.5" fill="#1D5180"/>
<text x="806" y="461" dominant-baseline="central" font-family="Inter" font-size="16.5" font-weight="500" fill="#1A1A1A">Whether you are on calls, or across a quiet table.</text>
<rect x="766" y="552" width="616" height="74" rx="14" fill="#FFFFFF"/>
<text x="784" y="578" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="600" fill="#1D5180">A quiet life needs far less of the device than a day of meetings does. That</text>
<text x="784" y="598" dominant-baseline="central" font-family="Inter" font-size="14" font-weight="600" fill="#1D5180">is the whole reason these two prices exist.</text>
<rect x="56" y="686" width="430.6666666666667" height="150" rx="20" fill="#FFECBB" stroke="none" stroke-width="0"/>
<text x="86" y="728" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#FBD34A">01</text>
<text x="132" y="728" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">Your hearing loss</text>
<text x="86" y="770" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="500" fill="#4C3205">Answered. It sets the shape.</text>
<circle cx="444.6666666666667" cy="722" r="15" fill="#FBD34A"/>
<path d="M 437.6666666666667 722 l 4.5 5 l 9.5 -10" fill="none" stroke="#4C3205" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="514.6666666666667" y="686" width="430.6666666666667" height="150" rx="20" fill="#EBF9FF" stroke="#BEE1F4" stroke-width="2.5"/>
<text x="544.6666666666667" y="728" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#BEE1F4">02</text>
<text x="590.6666666666667" y="728" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">Your lifestyle</text>
<text x="544.6666666666667" y="770" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="500" fill="#1D5180">This is the one that decides.</text>
<rect x="544.6666666666667" y="790" width="370.6666666666667" height="6" rx="3" fill="#BEE1F4"/>
<rect x="973.3333333333334" y="686" width="430.6666666666667" height="150" rx="20" fill="#D2FFF1" stroke="none" stroke-width="0"/>
<text x="1003.3333333333334" y="728" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#4CC1A1">03</text>
<text x="1049.3333333333335" y="728" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1A1A1A">Your budget</text>
<text x="1003.3333333333334" y="770" dominant-baseline="central" font-family="Inter" font-size="15" font-weight="500" fill="#265949">The last filter. Never the first.</text>
<text x="56" y="882" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#1A1A1A">So the rest of this video is really about step two.</text>
</svg>

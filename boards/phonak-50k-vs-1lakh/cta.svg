<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1260" height="762" viewBox="0 0 1260 762">
<rect x="0" y="0" width="1260" height="762" fill="#FAF8F4"/>
<rect x="56" y="60" width="288.96000000000004" height="34" rx="17" fill="#FFECBB"/>
<text x="200.48000000000002" y="77" text-anchor="middle" dominant-baseline="central" font-family="Inter" font-size="12" font-weight="700" fill="#4C3205">STILL NOT SURE WHICH ONE IS YOURS?</text>
<text x="56" y="158" font-family="Bricolage Grotesque" font-size="46" font-weight="700" fill="#1A1A1A">That is completely normal</text>
<rect x="56" y="174" width="72" height="7" rx="3.5" fill="#FBD34A"/>
<text x="56" y="208" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">Nobody picks a hearing aid off a comparison table. The last step is somebody looking</text>
<text x="56" y="232" font-family="Inter" font-size="18" font-weight="400" fill="#4F4F4F">at your audiogram and your life together.</text>
<rect x="56" y="250" width="560" height="272" rx="22" fill="#FFECBB" stroke="#FBD34A" stroke-width="2.5"/>
<rect x="86" y="280" width="52" height="52" rx="16" fill="#FFFFFF"/>
<g transform="translate(100 294) scale(1.0000)"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="2" y="6" width="14" height="12" rx="2" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="586" y="322" font-family="Bricolage Grotesque" font-size="40" font-weight="700" fill="#FBD34A" text-anchor="end">01</text>
<text x="86" y="362" font-family="Inter" font-size="11" font-weight="700" fill="#4C3205">ANYWHERE IN INDIA</text>
<text x="86" y="396" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#1A1A1A">Online consultation</text>
<text x="86" y="432" font-family="Inter" font-size="15.5" font-weight="400" fill="#4C3205">Send your audiogram, talk to an audiologist.</text>
<text x="86" y="458" font-family="Inter" font-size="15.5" font-weight="400" fill="#4C3205">They run this same framework on your numbers,</text>
<text x="86" y="484" font-family="Inter" font-size="15.5" font-weight="400" fill="#4C3205">your lifestyle and your budget.</text>
<rect x="644" y="250" width="560" height="272" rx="22" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<rect x="674" y="280" width="52" height="52" rx="16" fill="#FFECBB"/>
<g transform="translate(688 294) scale(1.0000)"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="10" r="3" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1174" y="322" font-family="Bricolage Grotesque" font-size="40" font-weight="700" fill="#FFECBB" text-anchor="end">02</text>
<text x="674" y="362" font-family="Inter" font-size="11" font-weight="700" fill="#6B6B6B">IF YOU CAN COME TO US</text>
<text x="674" y="396" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#1A1A1A">Hyderabad Experience Center</text>
<text x="674" y="432" font-family="Inter" font-size="15.5" font-weight="400" fill="#3A3A3A">Wear them. Walk around in them.</text>
<text x="674" y="458" font-family="Inter" font-size="15.5" font-weight="400" fill="#3A3A3A">Hear the difference between the bands</text>
<text x="674" y="484" font-family="Inter" font-size="15.5" font-weight="400" fill="#3A3A3A">before you decide anything.</text>
<rect x="57" y="563" width="602" height="76" rx="38" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1.5"/>
<rect x="84" y="579" width="44" height="44" rx="14" fill="#FFECBB"/>
<g transform="translate(94 589) scale(1.0000)"><path d="M14 4.1 12 6" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m5.1 8-2.9-.8" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m6 12-1.9 2" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.2 2.2 8 5.1" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z" fill="none" stroke="#4C3205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="144" y="601" dominant-baseline="central" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#1A1A1A">Or just browse at your own pace</text>
<line x1="511" y1="587" x2="511" y2="615" stroke="#E8E4DC" stroke-width="1.5"/>
<text x="531" y="601" dominant-baseline="central" font-family="Inter" font-size="16.5" font-weight="700" fill="#4C3205">synva.io</text>
<g transform="translate(614 592) scale(0.7500)"><path d="M7 7h10v10" fill="none" stroke="#4C3205" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 17 17 7" fill="none" stroke="#4C3205" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="56" y="686" font-family="Inter" font-size="15" font-weight="400" fill="#6B6B6B">No pressure either way. The catalogue and the prices are open to everyone.</text>
